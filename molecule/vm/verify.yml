---
# Post-REBOOT assertions. Observe the REAL cross-role boot chain (boot 2):
# clevis_encryption unlocked the disks from the EXTERNAL Tang, reached
# clevis-luks-unlocked.target, and encrypted_storage_pool's assemble -> check ->
# ready chain mounted the pool across the seam.
- name: "Verify the split boot chain (clevis NBDE + encrypted_storage_pool), post-reboot"
  hosts: clevis-target
  become: true
  gather_facts: false
  vars:
    esp_mnt: "/srv/{{ encrypted_storage_pool_name | default('data') }}"

  tasks:
    - name: "Assert encrypted-storage-ready.target reached (the boot barrier)"  # noqa: command-instead-of-module
      ansible.builtin.command: systemctl is-active encrypted-storage-ready.target
      register: _esp_ready
      changed_when: false
      failed_when: _esp_ready.stdout != "active"

    - name: "Assert clevis-luks-unlocked.target is active (the cross-role seam)"  # noqa: command-instead-of-module
      ansible.builtin.command: systemctl is-active clevis-luks-unlocked.target
      register: _esp_unlocked
      changed_when: false
      failed_when: _esp_unlocked.stdout != "active"

    - name: "Read this boot's journal for clevis-luks-unlocked.target"  # noqa: command-instead-of-module
      ansible.builtin.command: journalctl -b -u clevis-luks-unlocked.target --no-pager
      register: _esp_unlocked_journal
      changed_when: false

    - name: "Assert systemd EMITTED the 'Reached target' signal this boot"
      ansible.builtin.assert:
        that: "'Reached target' in _esp_unlocked_journal.stdout"
        fail_msg: >-
          systemd did not log 'Reached target' for clevis-luks-unlocked.target this
          boot. Journal was: {{ _esp_unlocked_journal.stdout }}
        success_msg: "systemd reached clevis-luks-unlocked.target this boot."

    - name: "Assert unlock + assemble + check services all succeeded"  # noqa: command-instead-of-module
      ansible.builtin.command: "systemctl is-active {{ item }}"
      loop:
        - clevis-unlock-data.service
        - encrypted-storage-assemble.service
        - encrypted-storage-check.service
      register: _esp_svc
      changed_when: false
      failed_when: _esp_svc.stdout != "active"
      loop_control:
        label: "{{ item }}"

    - name: "Read boot-activation timestamps for the cross-role ordering chain"  # noqa: command-instead-of-module
      ansible.builtin.command: >-
        systemctl show -p ActiveEnterTimestampMonotonic --value {{ item }}
      loop:
        - clevis-unlock-data.service
        - clevis-luks-unlocked.target
        - encrypted-storage-assemble.service
      register: _esp_ts
      changed_when: false
      loop_control:
        label: "{{ item }}"

    - name: "Assert the SEAM ordering held at boot (unlock-data <= target <= assemble)"
      vars:
        _u: "{{ _esp_ts.results[0].stdout | int }}"
        _t: "{{ _esp_ts.results[1].stdout | int }}"
        _a: "{{ _esp_ts.results[2].stdout | int }}"
      ansible.builtin.assert:
        that:
          - (_u | int) > 0
          - (_t | int) > 0
          - (_a | int) > 0
          - (_u | int) <= (_t | int)
          - (_t | int) <= (_a | int)
        fail_msg: >-
          Cross-role seam ordering broken (ActiveEnterTimestampMonotonic µs):
          clevis-unlock-data={{ _u }}, clevis-luks-unlocked.target={{ _t }},
          encrypted-storage-assemble={{ _a }} — expected all >0 and non-decreasing.
        success_msg: >-
          Seam ordering OK: unlock-data({{ _u }}) <= unlocked.target({{ _t }})
          <= assemble({{ _a }}) µs.

    - name: "Assert both data mappers are open after boot"
      ansible.builtin.command: "cryptsetup status crypt-{{ item }}"
      loop: [vdb, vdc]
      changed_when: false
      loop_control:
        label: "crypt-{{ item }}"

    - name: "Assert the pool is mounted at {{ esp_mnt }}"
      ansible.builtin.command: "mountpoint -q {{ esp_mnt }}"
      changed_when: false

    - name: "Assert real I/O on the pool survives the reboot (write + read back)"
      ansible.builtin.shell:
        cmd: |
          f="{{ esp_mnt }}/.esp-verify"
          echo esp-verified > "$f"
          test "$(cat "$f")" = esp-verified
          rm -f "$f"
        executable: /bin/bash
      changed_when: false

    - name: "PASS"
      ansible.builtin.debug:
        msg: >-
          Tier-2 split boot chain PASSED ({{ encrypted_storage_pool_backend | default('btrfs') }})
          — clevis unlocked the disks at boot from the external Tang,
          clevis-luks-unlocked.target reached, encrypted_storage_pool mounted the pool
          at {{ esp_mnt }} across the seam, real I/O round-trips, and
          encrypted-storage-ready.target is active.
